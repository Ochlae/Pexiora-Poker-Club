<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pexiora Poker Club - Inscription</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
}
.container {
    max-width: 760px;
    margin: auto;
    padding: 18px;
}
.logo {
    width: 180px;
    max-width: 60vw;
    margin: 5px 0 12px;
}
h1 {
    color: gold;
    font-size: clamp(26px, 7vw, 38px);
    margin: 8px 0;
}
.date-tournoi {
    font-size: clamp(20px, 5vw, 26px);
    font-weight: bold;
    color: #ffd966;
    background: #1d1d1d;
    border: 1px solid #555;
    border-radius: 10px;
    padding: 12px;
    margin: 12px 0 18px;
}
.compteur {
    font-size: 20px;
    margin: 10px 0;
}
input {
    padding: 12px;
    width: min(100%, 420px);
    margin: 9px 0;
    border-radius: 7px;
    border: none;
    font-size: 17px;
}
button {
    padding: 11px 15px;
    margin: 5px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 15px;
}
.inscrire { background: green; color: white; }
.desinscrire { background: #b51f1f; color: white; }
.liste {
    margin-top: 18px;
    text-align: left;
    background: #222;
    padding: 15px;
    border-radius: 10px;
    line-height: 1.65;
}
.info {
    color: #aaa;
    font-size: 13px;
    margin-top: 10px;
}
.admin-btn {
    margin-top: 26px;
    background: #444;
    color: #ddd;
    font-size: 12px;
}
.admin-zone {
    display: none;
    margin-top: 20px;
    text-align: left;
    background: #171717;
    border: 1px solid #555;
    padding: 16px;
    border-radius: 10px;
}
.admin-zone h2 {
    text-align: center;
    color: #ffcc66;
}
.admin-zone h3 {
    color: #ff9a9a;
    margin-top: 24px;
}
.admin-row {
    background: #222;
    border-radius: 8px;
    padding: 13px;
    margin-bottom: 15px;
}
.admin-row label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}
.admin-save { background: #9b6d00; color: white; }
.admin-close { background: #555; color: white; }
.admin-logout { background: #7a2020; color: white; }
.historique {
    overflow-x: auto;
    margin-top: 10px;
}
table {
    width: 100%;
    border-collapse: collapse;
    background: #202020;
    min-width: 600px;
}
th, td {
    border: 1px solid #555;
    padding: 8px;
    vertical-align: top;
}
th {
    background: #333;
    color: #ffd966;
    text-align: center;
}
td { text-align: left; }
.date-cell { white-space: nowrap; font-weight: bold; }
.etat { text-align: center; white-space: nowrap; }
.en-cours { color: #7CFC98; font-weight: bold; }
.archive { color: #ccc; }
.vide { color: #999; font-style: italic; }
.erreur { color: #ff8a8a; }
.ok { color: #9cffae; }
.petit { font-size: 12px; color: #aaa; }
ol { margin: 5px 0; padding-left: 22px; }
</style>
</head>

<body>
<div class="container">

<img src="logo.png" class="logo" alt="Pexiora Poker Club">

<h1>PEXIORA POKER CLUB</h1>

<div class="date-tournoi" id="dateTournoi">Chargement du tournoi…</div>

<div class="compteur" id="compteur">0 / 64 inscrits</div>

<input type="text" id="nom" placeholder="Votre pseudo" autocomplete="nickname">

<br>

<button class="inscrire" id="btnInscrire">Je m'inscris</button>
<button class="desinscrire" id="btnDesinscrire">Je me désinscris</button>

<div class="liste" id="liste">
    <span class="vide">Chargement de la liste…</span>
</div>

<div class="info" id="message"></div>

<button class="admin-btn" id="btnAdmin">Administration</button>

<div class="admin-zone" id="adminZone">

    <h2>Administration Pexiora</h2>

    <div class="admin-row">
        <strong>Tournoi en cours :</strong>
        <span id="adminTournoiCourant">—</span>
    </div>

    <div class="admin-row">
        <label for="nouvelleDate">Créer le prochain tournoi</label>
        <input type="date" id="nouvelleDate">
        <button class="admin-save" id="btnNouveauTournoi">Créer ce tournoi</button>
        <div class="petit">
            Le tournoi actuel sera conservé automatiquement dans l'historique.
        </div>
    </div>

    <h3>Désinscrits du tournoi en cours</h3>
    <div id="listeDesinscrits"><span class="vide">Aucun.</span></div>

    <h3>Historique des tournois</h3>
    <div class="historique" id="historique">
        <span class="vide">Chargement…</span>
    </div>

    <div style="text-align:center; margin-top:18px;">
        <button class="admin-close" id="btnFermerAdmin">Fermer</button>
        <button class="admin-logout" id="btnDeconnexion">Déconnexion admin</button>
    </div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
    getFirestore, doc, getDoc, setDoc, deleteDoc, addDoc,
    collection, getDocs, onSnapshot, query, orderBy,
    writeBatch, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

/* =========================================================
   1) À REMPLACER PAR LA CONFIGURATION DE TON PROJET FIREBASE
   Firebase > Paramètres du projet > Vos applications > Web
   ========================================================= */
const firebaseConfig = {
    apiKey: "AIzaSyCwoOz7yJlGC-X1x2LulMOb-GmubAIDu2E",
    authDomain: "pexiora-poker-club.firebaseapp.com",
    projectId: "pexiora-poker-club",
    storageBucket: "pexiora-poker-club.firebasestorage.app",
    messagingSenderId: "461295835905",
    appId: "1:461295835905:web:f4e5c48acaf6114df91900"
};

/* =========================================================
   2) ADRESSE TECHNIQUE DU COMPTE ADMIN DE JULIEN
   La même adresse doit être utilisée dans Firebase Authentication
   et dans firestore.rules.
   ========================================================= */
const ADMIN_EMAIL = "julien.rode11@gmail.com";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let tournoiIdCourant = null;
let tournoiDateCourante = "";
let joueursCourants = [];
let stopEcouteJoueurs = null;
let adminConnecte = false;

const $ = id => document.getElementById(id);

function normaliserPseudo(pseudo) {
    return pseudo.trim().toLocaleLowerCase("fr-FR")
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9_-]/g, "_")
        .slice(0, 80);
}

function formaterDate(dateISO) {
    if (!dateISO) return "—";
    const [a, m, j] = dateISO.split("-");
    return `${j}/${m}/${a}`;
}

function echapperHTML(texte) {
    return String(texte)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function afficherMessage(texte, type = "") {
    $("message").className = "info " + type;
    $("message").textContent = texte;
}

async function chargerTournoiCourant() {
    try {
        const refConfig = doc(db, "config", "app");
        const snap = await getDoc(refConfig);

        if (!snap.exists() || !snap.data().currentTournamentId) {
            tournoiIdCourant = null;
            tournoiDateCourante = "";
            $("dateTournoi").textContent = "Aucun tournoi ouvert pour le moment";
            $("compteur").textContent = "0 / 64 inscrits";
            $("liste").innerHTML = '<span class="vide">Les inscriptions ne sont pas encore ouvertes.</span>';
            return;
        }

        tournoiIdCourant = snap.data().currentTournamentId;

        const tournoiSnap = await getDoc(doc(db, "tournois", tournoiIdCourant));
        if (!tournoiSnap.exists()) {
            throw new Error("Le tournoi courant est introuvable.");
        }

        tournoiDateCourante = tournoiSnap.data().date || "";
        $("dateTournoi").textContent = "Tournoi du " + formaterDate(tournoiDateCourante);
        $("adminTournoiCourant").textContent = formaterDate(tournoiDateCourante);

        ecouterJoueurs();
    } catch (e) {
        console.error(e);
        afficherMessage("Impossible de charger le tournoi. Vérifie la connexion Internet.", "erreur");
    }
}

function ecouterJoueurs() {
    if (stopEcouteJoueurs) stopEcouteJoueurs();
    if (!tournoiIdCourant) return;

    const q = query(
        collection(db, "tournois", tournoiIdCourant, "joueurs"),
        orderBy("pseudo")
    );

    stopEcouteJoueurs = onSnapshot(q, snap => {
        joueursCourants = snap.docs.map(d => ({ id: d.id, ...d.data() }));

        $("compteur").textContent = `${joueursCourants.length} / 64 inscrits`;

        if (!joueursCourants.length) {
            $("liste").innerHTML = '<span class="vide">Aucun joueur inscrit pour le moment.</span>';
            return;
        }

        $("liste").innerHTML = joueursCourants
            .map((j, i) => `${i + 1}. ${echapperHTML(j.pseudo)}<br>`)
            .join("");
    }, e => {
        console.error(e);
        afficherMessage("La liste des inscrits ne peut pas être chargée.", "erreur");
    });
}

async function inscrire() {
    if (!tournoiIdCourant) {
        alert("Aucun tournoi n'est ouvert actuellement.");
        return;
    }

    const pseudo = $("nom").value.trim();
    if (!pseudo) {
        alert("Entre ton pseudo !");
        return;
    }

    if (joueursCourants.some(j => j.pseudo.toLowerCase() === pseudo.toLowerCase())) {
        alert("Ce pseudo est déjà inscrit !");
        return;
    }

    if (joueursCourants.length >= 64) {
        alert("Le tournoi est complet.");
        return;
    }

    const idJoueur = normaliserPseudo(pseudo);
    if (!idJoueur) {
        alert("Ce pseudo n'est pas valide.");
        return;
    }

    try {
        await setDoc(doc(db, "tournois", tournoiIdCourant, "joueurs", idJoueur), {
            pseudo,
            inscritLe: serverTimestamp()
        });

        $("nom").value = "";
        afficherMessage("Inscription enregistrée.", "ok");
    } catch (e) {
        console.error(e);
        afficherMessage("L'inscription n'a pas pu être enregistrée.", "erreur");
    }
}

async function desinscrire() {
    if (!tournoiIdCourant) {
        alert("Aucun tournoi n'est ouvert actuellement.");
        return;
    }

    const pseudoSaisi = $("nom").value.trim();
    if (!pseudoSaisi) {
        alert("Entre ton pseudo !");
        return;
    }

    const joueur = joueursCourants.find(
        j => j.pseudo.toLowerCase() === pseudoSaisi.toLowerCase()
    );

    if (!joueur) {
        alert("Ce pseudo n'est pas inscrit à ce tournoi.");
        return;
    }

    try {
        const batch = writeBatch(db);

        batch.delete(
            doc(db, "tournois", tournoiIdCourant, "joueurs", joueur.id)
        );

        const refDesinscription = doc(
            collection(db, "tournois", tournoiIdCourant, "desinscriptions")
        );

        batch.set(refDesinscription, {
            pseudo: joueur.pseudo,
            desinscritLe: serverTimestamp()
        });

        await batch.commit();

        $("nom").value = "";
        afficherMessage("Désinscription enregistrée.", "ok");
    } catch (e) {
        console.error(e);
        afficherMessage("La désinscription n'a pas pu être enregistrée.", "erreur");
    }
}

async function connexionAdmin() {
    const code = prompt("Code administrateur :");
    if (code === null || code === "") return;

    try {
        await signInWithEmailAndPassword(auth, ADMIN_EMAIL, code);
        adminConnecte = true;
        $("adminZone").style.display = "block";
        await rafraichirAdministration();
    } catch (e) {
        console.error(e);
        alert("Code administrateur incorrect.");
    }
}

async function rafraichirAdministration() {
    if (!adminConnecte) return;

    $("adminTournoiCourant").textContent =
        tournoiDateCourante ? formaterDate(tournoiDateCourante) : "Aucun";

    await Promise.all([
        afficherDesinscritsCourants(),
        afficherHistorique()
    ]);
}

async function afficherDesinscritsCourants() {
    if (!tournoiIdCourant) {
        $("listeDesinscrits").innerHTML = '<span class="vide">Aucun tournoi en cours.</span>';
        return;
    }

    try {
        const q = query(
            collection(db, "tournois", tournoiIdCourant, "desinscriptions"),
            orderBy("desinscritLe", "desc")
        );
        const snap = await getDocs(q);

        if (snap.empty) {
            $("listeDesinscrits").innerHTML = '<span class="vide">Aucune désinscription.</span>';
            return;
        }

        $("listeDesinscrits").innerHTML =
            "<ol>" +
            snap.docs.map(d => `<li>${echapperHTML(d.data().pseudo)}</li>`).join("") +
            "</ol>";
    } catch (e) {
        console.error(e);
        $("listeDesinscrits").innerHTML =
            '<span class="erreur">Impossible de charger les désinscriptions.</span>';
    }
}

async function afficherHistorique() {
    try {
        const qTournois = query(collection(db, "tournois"), orderBy("date", "desc"));
        const snapTournois = await getDocs(qTournois);

        if (snapTournois.empty) {
            $("historique").innerHTML = '<span class="vide">Aucun tournoi enregistré.</span>';
            return;
        }

        let lignes = "";

        for (const tournoiDoc of snapTournois.docs) {
            const t = tournoiDoc.data();

            const [snapJoueurs, snapDesinscrits] = await Promise.all([
                getDocs(query(
                    collection(db, "tournois", tournoiDoc.id, "joueurs"),
                    orderBy("pseudo")
                )),
                getDocs(query(
                    collection(db, "tournois", tournoiDoc.id, "desinscriptions"),
                    orderBy("desinscritLe", "desc")
                ))
            ]);

            const inscrits = snapJoueurs.docs.map(d => d.data().pseudo);
            const desinscrits = snapDesinscrits.docs.map(d => d.data().pseudo);

            const listeInscrits = inscrits.length
                ? "<ol>" + inscrits.map(p => `<li>${echapperHTML(p)}</li>`).join("") + "</ol>"
                : '<span class="vide">Aucun</span>';

            const listeDesinscrits = desinscrits.length
                ? "<ol>" + desinscrits.map(p => `<li>${echapperHTML(p)}</li>`).join("") + "</ol>"
                : '<span class="vide">Aucun</span>';

            lignes += `
                <tr>
                    <td class="date-cell">${formaterDate(t.date)}</td>
                    <td class="etat">
                        <span class="${t.statut === "en_cours" ? "en-cours" : "archive"}">
                            ${t.statut === "en_cours" ? "En cours" : "Archivé"}
                        </span>
                    </td>
                    <td><strong>${inscrits.length}</strong>${listeInscrits}</td>
                    <td><strong>${desinscrits.length}</strong>${listeDesinscrits}</td>
                </tr>
            `;
        }

        $("historique").innerHTML = `
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>État</th>
                        <th>Inscrits</th>
                        <th>Désinscrits</th>
                    </tr>
                </thead>
                <tbody>${lignes}</tbody>
            </table>
        `;
    } catch (e) {
        console.error(e);
        $("historique").innerHTML =
            '<span class="erreur">Impossible de charger l’historique.</span>';
    }
}

async function creerNouveauTournoi() {
    if (!adminConnecte) return;

    const nouvelleDate = $("nouvelleDate").value;
    if (!nouvelleDate) {
        alert("Choisis la date du prochain tournoi.");
        return;
    }

    if (nouvelleDate === tournoiDateCourante) {
        alert("Cette date est déjà celle du tournoi en cours.");
        return;
    }

    const texte = tournoiDateCourante
        ? `Le tournoi du ${formaterDate(tournoiDateCourante)} sera archivé et le tournoi du ${formaterDate(nouvelleDate)} deviendra le tournoi en cours. Continuer ?`
        : `Créer le tournoi du ${formaterDate(nouvelleDate)} ?`;

    if (!confirm(texte)) return;

    try {
        const nouvelId = nouvelleDate;
        const batch = writeBatch(db);

        if (tournoiIdCourant) {
            batch.set(
                doc(db, "tournois", tournoiIdCourant),
                { statut: "archive" },
                { merge: true }
            );
        }

        batch.set(doc(db, "tournois", nouvelId), {
            date: nouvelleDate,
            statut: "en_cours",
            creeLe: serverTimestamp()
        }, { merge: true });

        batch.set(doc(db, "config", "app"), {
            currentTournamentId: nouvelId
        }, { merge: true });

        await batch.commit();

        if (stopEcouteJoueurs) stopEcouteJoueurs();

        tournoiIdCourant = nouvelId;
        tournoiDateCourante = nouvelleDate;
        joueursCourants = [];

        $("nouvelleDate").value = "";
        $("dateTournoi").textContent = "Tournoi du " + formaterDate(nouvelleDate);
        $("adminTournoiCourant").textContent = formaterDate(nouvelleDate);

        ecouterJoueurs();
        await rafraichirAdministration();

        alert("Le nouveau tournoi est ouvert.");
    } catch (e) {
        console.error(e);
        alert("Impossible de créer le tournoi.");
    }
}

$("btnInscrire").addEventListener("click", inscrire);
$("btnDesinscrire").addEventListener("click", desinscrire);
$("btnAdmin").addEventListener("click", connexionAdmin);
$("btnNouveauTournoi").addEventListener("click", creerNouveauTournoi);
$("btnFermerAdmin").addEventListener("click", () => {
    $("adminZone").style.display = "none";
});
$("btnDeconnexion").addEventListener("click", async () => {
    await signOut(auth);
    adminConnecte = false;
    $("adminZone").style.display = "none";
});
$("nom").addEventListener("keydown", e => {
    if (e.key === "Enter") inscrire();
});

onAuthStateChanged(auth, user => {
    adminConnecte = !!(user && user.email === ADMIN_EMAIL);
});

chargerTournoiCourant();
</script>
</body>
</html>
